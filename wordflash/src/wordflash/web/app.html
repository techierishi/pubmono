<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordFlash</title>
<style>
[hidden]{display:none!important}
:root{--bg:#111827;--panel:#1f2937;--panel2:#172033;--text:#f9fafb;--muted:#9ca3af;--green:#22c55e;--red:#ef4444;--gray:#6b7280;--teal:#14b8a6;--accent:#3b82f6;--border:#374151}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
#topnav{display:flex;gap:4px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
#topnav button{background:transparent;color:var(--muted);border:none;padding:9px 18px;border-radius:8px;font-size:15px;cursor:pointer}
#topnav button.active{background:var(--accent);color:#fff}
section{display:none;padding:18px}
section.active{display:block}
h2{margin:0 0 14px;font-size:20px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
input,select{width:100%;max-width:420px;padding:9px;border-radius:6px;border:1px solid var(--border);background:#111827;color:var(--text);font-size:14px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px}
.check input{width:auto}
.check label{margin:0;color:var(--text);font-size:14px}
button{cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
#genstatus{margin-top:14px;font-size:14px;color:var(--muted);min-height:20px}
#genlog{margin-top:10px;background:#0b0f19;border:1px solid var(--border);border-radius:8px;padding:12px;height:320px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;color:#cbd5e1}
#downloads{margin-top:16px}
#downloads a{color:var(--accent);display:block;margin:4px 0}
.row{display:flex;gap:20px;flex-wrap:wrap}
.col{flex:1;min-width:260px}
/* review */
#reviewwrap{display:flex;height:calc(100vh - 140px);border:1px solid var(--border);border-radius:10px;overflow:hidden}
#sidebar{width:290px;background:var(--panel2);overflow-y:auto;border-right:1px solid var(--border);padding:10px;flex-shrink:0}
#sidebar h3{font-size:13px;margin:0 0 8px;color:var(--muted)}
#list .item{padding:6px 8px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:13px}
#list .item.undecided{background:#374151}
#list .item.accept{background:#14532d;color:#bbf7d0}
#list .item.fixed{background:#134e4a;color:#99f6e4}
#list .item.reject{background:#7f1d1d;color:#fecaca}
#list .item.skip{background:#374151;color:#9ca3af}
#list .item.active{outline:2px solid var(--accent)}
#rmain{flex:1;display:flex;flex-direction:column;overflow:auto}
#rtopbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
#rtopbar h3{margin:0;font-size:15px}
#progress{margin-left:auto;font-size:14px;color:var(--muted)}
#export,#next{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:14px}
#card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
#word{font-size:28px;font-weight:600}
#term{font-size:13px;color:var(--muted);margin-bottom:14px}
#imgwrap{max-width:min(90%,720px)}
#imgwrap img{max-width:100%;max-height:55vh;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#noimg{color:var(--red);font-size:18px}
#controls{display:flex;gap:12px;margin-top:22px}
button.big{font-size:16px;padding:10px 22px;border-radius:8px;border:none;font-weight:600}
#accept{background:var(--green);color:#052e16}
#reject{background:var(--red);color:#450a0a}
#skip{background:var(--gray);color:#fff}
#back{background:transparent;color:var(--muted);border:1px solid var(--border)}
#hint{margin-top:14px;color:var(--muted);font-size:12px}
#status{margin-top:8px;color:var(--muted);font-size:14px;min-height:20px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;width:min(92vw,860px);max-height:90vh;overflow:auto}
.panel h3{margin:0 0 12px;font-size:18px}
#candidates{display:flex;flex-wrap:wrap;gap:10px}
#candidates .cand{width:180px;height:140px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
#candidates .cand:hover{border-color:var(--accent)}
#candidates .loading{color:var(--muted)}
.searchrow{display:flex;gap:8px;margin-top:10px}
.searchrow button{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:8px 14px;border-radius:6px;font-size:13px}
.urlrow{display:flex;gap:8px;margin-top:14px}
.urlrow input{flex:1;padding:9px;border-radius:6px;border:1px solid var(--border);background:#111827;color:var(--text)}
.urlrow button{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:6px}
.panel-actions{display:flex;gap:10px;margin-top:14px}
.panel-actions button{padding:8px 14px;border-radius:6px;border:none}
#leave{background:var(--gray);color:#fff}
#cancel{background:transparent;color:var(--muted);border:1px solid var(--border)}
#fixstatus{margin-top:10px;color:var(--muted);font-size:13px;min-height:18px}
</style>
</head>
<body>
<nav id="topnav">
  <button data-tab="generate" class="active">Generate</button>
  <button data-tab="review">Review</button>
</nav>

<section id="tab-generate" class="active">
  <h2>Generate Anki deck</h2>
  <div class="row">
    <div class="col">
      <label>YAML file</label>
      <select id="g-yaml"></select>
      <label>Deck name</label>
      <input id="g-deck" value="Kids Picture Words German">
      <label>Type</label>
      <select id="g-type">
        <option value="auto">auto</option>
        <option value="quiz">quiz</option>
        <option value="vocab">vocab</option>
      </select>
      <label>Image provider</label>
      <select id="g-provider">
        <option value="auto">auto (DDG → Wikimedia → Bing → Pixabay)</option>
        <option value="wikimedia" selected>wikimedia</option>
        <option value="duckduckgo">duckduckgo</option>
        <option value="bing">bing</option>
        <option value="pixabay">pixabay</option>
      </select>
    </div>
    <div class="col">
      <label>Question language</label>
      <input id="g-qlang" value="en">
      <label>Answer language</label>
      <input id="g-alang" value="de">
      <label>Source language (vocab)</label>
      <input id="g-slang" value="de">
      <label>Target language (vocab)</label>
      <input id="g-tlang" value="en">
      <label>Request delay (seconds)</label>
      <input id="g-delay" type="number" step="0.1" value="1.0">
      <div class="check"><input id="g-batch" type="checkbox" checked><label for="g-batch">Batch (no image approval)</label></div>
      <div class="check"><input id="g-force" type="checkbox"><label for="g-force">Force re-download images</label></div>
    </div>
  </div>
  <br>
  <button id="generate" class="btn">Generate</button>
  <div id="genstatus"></div>
  <div id="genlog"></div>
  <div id="downloads"><h3>Generated decks</h3></div>
</section>

<section id="tab-review">
  <h2>Review &amp; fix images</h2>
  <div class="row">
    <div class="col">
      <label>YAML file</label>
      <select id="r-yaml"></select>
    </div>
    <div class="col">
      <label>Image provider</label>
      <select id="r-provider">
        <option value="wikimedia" selected>wikimedia</option>
        <option value="auto">auto</option>
        <option value="duckduckgo">duckduckgo</option>
        <option value="bing">bing</option>
        <option value="pixabay">pixabay</option>
      </select>
    </div>
    <div class="col" style="display:flex;align-items:flex-end">
      <button id="r-load" class="btn">Load review</button>
    </div>
  </div>
  <br>
  <div id="reviewwrap" hidden>
    <aside id="sidebar"><h3>Cards</h3><div id="list"></div></aside>
    <main id="rmain">
      <div id="rtopbar">
        <h3>Image Review</h3>
        <button id="next">Next undecided →</button>
        <div id="progress"></div>
        <button id="export">Export fix_wrong.yaml</button>
      </div>
      <div id="card">
        <div id="word"></div>
        <div id="term"></div>
        <div id="imgwrap"><img id="img" alt=""></div>
        <div id="noimg" hidden>No cached image</div>
        <div id="controls">
          <button id="back" class="big">← Back</button>
          <button id="reject" class="big">✗ Reject</button>
          <button id="skip" class="big">Skip</button>
          <button id="accept" class="big">✓ Accept</button>
        </div>
        <div id="hint">Keys: y / Enter = accept · n = reject (choose replacement) · s = skip · b = back · e = export</div>
        <div id="status"></div>
      </div>
    </main>
  </div>
</section>

<div id="fixoverlay" class="overlay" hidden>
  <div class="panel">
    <h3>Replace image for "<span id="fixword"></span>"</h3>
    <div id="candidates"><div class="loading">Searching…</div></div>
    <div class="searchrow">
      <button id="ddg">Search DuckDuckGo ↗</button>
      <button id="bing">Search Bing ↗</button>
    </div>
    <div class="urlrow">
      <input id="url" placeholder="Paste an image URL…">
      <button id="useurl">Use URL</button>
    </div>
    <div class="panel-actions">
      <button id="leave">Leave for later</button>
      <button id="cancel">Cancel</button>
    </div>
    <div id="fixstatus"></div>
  </div>
</div>

<script>
let state = null;
let current = null;
let fixingTerm = null;
let reviewedStack = [];
let genLogCursor = 0;
let genPolling = false;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  return r.json();
}

/* ---------- tabs ---------- */
document.querySelectorAll('#topnav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#topnav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  };
});

/* ---------- generate ---------- */
async function loadYamls() {
  const r = await api('/api/yamls');
  for (const id of ['g-yaml', 'r-yaml']) {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    for (const y of r.yamls) {
      const o = document.createElement('option');
      o.value = y.path;
      o.textContent = y.name;
      if (y.name.includes('kids_picture_words')) o.selected = true;
      sel.appendChild(o);
    }
  }
}
async function refreshDecks() {
  const r = await api('/api/decks');
  const div = document.getElementById('downloads');
  div.innerHTML = '<h3>Generated decks</h3>';
  for (const d of r.decks) {
    const a = document.createElement('a');
    a.href = d.url;
    a.textContent = d.name + ' (' + (d.size/1048576).toFixed(1) + ' MB)';
    div.appendChild(a);
  }
}
document.getElementById('generate').onclick = async () => {
  const cfg = {
    yaml: document.getElementById('g-yaml').value,
    deck_name: document.getElementById('g-deck').value,
    type: document.getElementById('g-type').value,
    image_provider: document.getElementById('g-provider').value,
    question_lang: document.getElementById('g-qlang').value,
    answer_lang: document.getElementById('g-alang').value,
    source_lang: document.getElementById('g-slang').value,
    target_lang: document.getElementById('g-tlang').value,
    request_delay: parseFloat(document.getElementById('g-delay').value) || 1.0,
    batch: document.getElementById('g-batch').checked,
    force: document.getElementById('g-force').checked
  };
  document.getElementById('genlog').textContent = '';
  genLogCursor = 0;
  document.getElementById('genstatus').textContent = 'Starting…';
  document.getElementById('generate').disabled = true;
  const r = await api('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cfg)});
  if (r.error) { document.getElementById('genstatus').textContent = 'Error: ' + r.error; document.getElementById('generate').disabled = false; return; }
  pollGenerate();
};
async function pollGenerate() {
  const r = await api('/api/generate/status?after=' + genLogCursor);
  const log = document.getElementById('genlog');
  if (r.lines && r.lines.length) {
    log.textContent += r.lines.join('\n') + '\n';
    genLogCursor += r.lines.length;
    log.scrollTop = log.scrollHeight;
  }
  if (r.running || !r.done) {
    document.getElementById('genstatus').textContent = 'Generating… ' + r.total + ' lines';
    setTimeout(pollGenerate, 600);
  } else {
    document.getElementById('generate').disabled = false;
    if (r.error) {
      document.getElementById('genstatus').textContent = 'Error: ' + r.error;
    } else {
      document.getElementById('genstatus').textContent = 'Done → ' + r.output;
      refreshDecks();
    }
  }
}

/* ---------- review ---------- */
function findCard(term) { return state.cards.find(c => c.search_term === term); }
function nextUndecided() {
  const c = state.cards.find(c => !c.status);
  return c ? c.search_term : null;
}
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const c of state.cards) {
    const d = document.createElement('div');
    d.className = 'item ' + (c.status || 'undecided');
    d.dataset.term = c.search_term;
    const marks = {accept:'✓ ', fixed:'✔ ', reject:'✗ ', skip:'· '};
    d.textContent = (marks[c.status] || '') + c.question;
    d.onclick = () => { current = c.search_term; render(); };
    list.appendChild(d);
  }
  for (const el of list.querySelectorAll('.item')) {
    el.classList.toggle('active', el.dataset.term === current);
  }
  const c = state.counts;
  document.getElementById('progress').textContent =
    state.decided + ' / ' + state.total + ' · reject ' + c.reject + ' · fixed ' + c.fixed;

  if (!current || !findCard(current)) {
    current = nextUndecided();
    if (!current) {
      document.getElementById('word').textContent = 'All done!';
      document.getElementById('term').textContent = '';
      document.getElementById('img').style.display = 'none';
      document.getElementById('noimg').hidden = true;
      return;
    }
  }
  const card = findCard(current);
  document.getElementById('word').textContent = card.question;
  document.getElementById('term').textContent = 'search: ' + card.search_term;
  const img = document.getElementById('img');
  const noimg = document.getElementById('noimg');
  if (card.image) { img.src = card.image; img.style.display = ''; noimg.hidden = true; }
  else { img.style.display = 'none'; noimg.hidden = false; }
}
async function decide(decision) {
  if (!current) return;
  const term = current;
  reviewedStack.push(term);
  state = await api('/api/decision', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({term, decision})
  });
  current = nextUndecided();
  render();
}
async function openFix() {
  if (!current) return;
  const card = findCard(current);
  fixingTerm = current;
  document.getElementById('fixword').textContent = card.question;
  document.getElementById('candidates').innerHTML = '<div class="loading">Searching…</div>';
  document.getElementById('fixstatus').textContent = '';
  document.getElementById('url').value = '';
  document.getElementById('fixoverlay').hidden = false;
  const r = await api('/api/search', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({term: fixingTerm})
  });
  const cand = document.getElementById('candidates');
  cand.innerHTML = '';
  const urls = r.candidates || [];
  if (urls.length === 0) {
    cand.innerHTML = '<div class="loading">No candidates found — use search buttons or paste a URL.</div>';
    return;
  }
  for (const url of urls) {
    const img = document.createElement('img');
    img.src = url; img.className = 'cand'; img.title = 'Click to use this image';
    img.onclick = () => pick(url);
    img.onerror = () => { img.style.display = 'none'; };
    cand.appendChild(img);
  }
}
async function pick(url) {
  if (!fixingTerm) return;
  document.getElementById('fixstatus').textContent = 'Downloading…';
  const r = await api('/api/pick', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({term: fixingTerm, url})
  });
  if (r.ok) {
    state = r;
    document.getElementById('fixoverlay').hidden = true;
    fixingTerm = null;
    reviewedStack.push(current);
    current = nextUndecided();
    render();
  } else {
    document.getElementById('fixstatus').textContent = 'Download failed — try another image or URL.';
  }
}
async function leaveForLater() {
  if (!fixingTerm) return;
  state = await api('/api/decision', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({term: fixingTerm, decision: 'reject'})
  });
  document.getElementById('fixoverlay').hidden = true;
  fixingTerm = null;
  reviewedStack.push(current);
  current = nextUndecided();
  render();
}
async function goBack() {
  const term = reviewedStack.pop();
  if (!term) return;
  state = await api('/api/undo', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({term})
  });
  current = term;
  render();
}
async function exportList() {
  const r = await api('/api/export', {method: 'POST'});
  document.getElementById('status').textContent = 'Exported ' + r.exported + ' rejected card(s) to ' + r.path;
}
function openSearch(engine) {
  if (!fixingTerm) return;
  const q = encodeURIComponent(fixingTerm);
  if (engine === 'ddg') window.open('https://duckduckgo.com/?q=' + q + '&iax=images&ia=images', '_blank');
  else window.open('https://www.bing.com/images/search?q=' + q, '_blank');
}
document.getElementById('r-load').onclick = async () => {
  const r = await api('/api/review/init', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({yaml: document.getElementById('r-yaml').value, provider: document.getElementById('r-provider').value})
  });
  if (r.error) { alert(r.error); return; }
  state = r;
  current = nextUndecided() || (state.cards[0] && state.cards[0].search_term);
  document.getElementById('reviewwrap').hidden = false;
  render();
};
document.getElementById('accept').onclick = () => decide('accept');
document.getElementById('reject').onclick = openFix;
document.getElementById('skip').onclick = () => decide('skip');
document.getElementById('back').onclick = goBack;
document.getElementById('export').onclick = exportList;
document.getElementById('next').onclick = () => { current = nextUndecided(); render(); };
document.getElementById('useurl').onclick = () => pick(document.getElementById('url').value.trim());
document.getElementById('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') pick(document.getElementById('url').value.trim()); });
document.getElementById('ddg').onclick = () => openSearch('ddg');
document.getElementById('bing').onclick = () => openSearch('bing');
document.getElementById('leave').onclick = leaveForLater;
document.getElementById('cancel').onclick = () => { document.getElementById('fixoverlay').hidden = true; fixingTerm = null; };
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (!document.getElementById('fixoverlay').hidden) {
    if (e.key === 'Escape') { document.getElementById('fixoverlay').hidden = true; fixingTerm = null; }
    return;
  }
  if (e.key === 'y' || e.key === 'Enter') decide('accept');
  else if (e.key === 'n') openFix();
  else if (e.key === 's') decide('skip');
  else if (e.key === 'b') goBack();
  else if (e.key === 'e') exportList();
});

/* ---------- boot ---------- */
loadYamls();
refreshDecks();
</script>
</body>
</html>
